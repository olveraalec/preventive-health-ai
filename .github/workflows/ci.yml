name: Python quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_DB_TESTS: "0"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked project and development dependencies
        id: sync
        run: uv sync --locked --group dev
      - name: Run full suite with database integration disabled
        run: uv run --no-sync pytest -q -ra --junitxml=pytest-results.xml
      - name: Ruff (explicit clean baseline)
        if: ${{ always() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff check --config ruff-ci.toml .
      - name: Report test counts and skips
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-results.xml")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Pytest results\n\n")
              if not report.is_file():
                  summary.write("No pytest report produced; inspect the failed setup/test step.\n")
              else:
                  suites = list(ET.parse(report).getroot().iter("testsuite"))
                  totals = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ("tests", "failures", "errors", "skipped")}
                  passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
                  summary.write(f"Passed: {passed}; failures: {totals['failures']}; "
                                f"errors: {totals['errors']}; skipped: {totals['skipped']}.\n\n")
                  for skipped in ET.parse(report).getroot().iter("skipped"):
                      reason = skipped.get("message", "No reason supplied").replace("\n", " ")
                      summary.write(f"- Skipped: {reason}\n")
          PY
