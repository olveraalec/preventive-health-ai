name: Publish verified research API to private ECR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ecr-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_EC2_METADATA_DISABLED: "true"
  ECR_REPOSITORY: preventive-health-ai
  LOCAL_IMAGE: preventive-health-ai:${{ github.sha }}
  PYTHON_DOTENV_DISABLED: "1"
  RUN_DB_TESTS: "0"

jobs:
  validate:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'olveraalec/preventive-health-ai' &&
          github.ref == 'refs/heads/feature/codex-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate publishing scope and configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                "$GITHUB_REPOSITORY" != "olveraalec/preventive-health-ai" ||
                "$GITHUB_REF" != "refs/heads/feature/codex-integration" ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publishing requires the authorized repository, branch, manual event and exact commit."
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-west-2" || ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::Set repository variables AWS_REGION=us-west-2 and AWS_ROLE_ARN to the existing ECR OIDC role."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked project and development dependencies
        run: uv sync --locked --group dev
      - name: Run required backend tests
        run: uv run --no-sync pytest -q -ra --junitxml=pytest-publish.xml
      - name: Ruff (existing clean scope)
        run: uv run --no-sync ruff check --config ruff-ci.toml .
      - name: Report tests and skips
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-publish.xml")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              if not report.is_file():
                  summary.write("No test report produced; publishing remains blocked.\n")
              else:
                  root = ET.parse(report).getroot()
                  suites = list(root.iter("testsuite"))
                  totals = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ("tests", "failures", "errors", "skipped")}
                  passed = totals["tests"] - sum(totals[key] for key in ("failures", "errors", "skipped"))
                  summary.write(f"Backend tests: {passed} passed; {totals['failures']} failed; "
                                f"{totals['errors']} errors; {totals['skipped']} skipped.\n")
                  for skipped in root.iter("skipped"):
                      summary.write(f"- Skip: {skipped.get('message', 'Unspecified')}\n")
          PY

  publish:
    needs: validate
    if: >-
      ${{ needs.validate.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'olveraalec/preventive-health-ai' &&
          github.ref == 'refs/heads/feature/codex-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build and load exact candidate (no AWS credentials)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$LOCAL_IMAGE" .
      - name: Verify architecture and model-free API offline
        run: |
          set -euo pipefail
          if [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$LOCAL_IMAGE")" != "linux/amd64" ||
                "$(docker image inspect --format '{{.Config.User}}' "$LOCAL_IMAGE")" != "appuser" ]]; then
            echo "::error::Unexpected image architecture or runtime user."
            exit 1
          fi
          docker run --platform linux/amd64 --rm --network none -i --entrypoint python \
            -e PYTHON_DOTENV_DISABLED=1 "$LOCAL_IMAGE" - <<'PY'
          from pathlib import Path
          from fastapi.testclient import TestClient
          from healthcare_ai_lab.api.main import app

          assert not any(Path("/app", name).exists() for name in (
              ".env", ".git", ".aws", "data", "results", "artifacts", "notebooks"
          )), "Unapproved runtime content"
          assert all(p.suffix == ".py" for p in Path("/app/src").rglob("*") if p.is_file()), "Unexpected source payload"
          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200 and response.json()["status"] == "ok"
              response = client.get("/ready")
              assert response.status_code == 200 and response.json()["inference_enabled"] is False
              response = client.post("/api/v1/research/sepsis/predict-engineered", json={"features": {}})
              assert response.status_code == 503, "Model-free image must not advertise model availability"
          print("Offline model-free API smoke test passed; no database or model readiness claimed.")
          PY
      - name: Assume existing ECR role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ecr-publish-${{ github.run_id }}
          unset-current-credentials: true
      - name: Login to private Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private
          mask-password: "true"
      - name: Push verified candidate and report immutable digest
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$image_uri" || exit 1
          docker push "$image_uri" || exit 1
          if ! digest="$(aws ecr describe-images --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"; then
            echo "::error::Cannot verify remote ECR digest."
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR did not return a valid immutable image digest."
            exit 1
          fi
          printf 'image_uri=%s\ndigest=%s\n' "$image_uri" "$digest" >> "$GITHUB_OUTPUT"
          {
            printf '### Verified model-free research API image\n\n'
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Image: %s\n' "$image_uri"
            printf -- '- Immutable reference: %s/%s@%s\n' "$ECR_REGISTRY" "$ECR_REPOSITORY" "$digest"
            printf -- '- Platform: linux/amd64; tests and offline smoke passed.\n'
            printf -- '- No model bundle, patient data or credentials included. No deployment performed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
