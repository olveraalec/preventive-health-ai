# Explicit clean baseline; legacy research files remain outside this CI scope.
# Extend this list alongside new production modules and their regression tests.
target-version = "py312"
include = [
    "src/healthcare_ai_lab/api/main.py",
    "src/healthcare_ai_lab/models/artifact.py",
    "src/healthcare_ai_lab/models/sepsis_inference.py",
    "src/healthcare_ai_lab/preprocessing/sepsis.py",
    "src/healthcare_ai_lab/trajectories/**/*.py",
    "src/healthcare_ai_lab/experiments/verify_sepsis_bundle.py",
    "src/healthcare_ai_lab/experiments/allocation_comparison.py",
    "src/healthcare_ai_lab/experiments/allocation_sources.py",
    "src/healthcare_ai_lab/experiments/export_decisions.py",
    "src/healthcare_ai_lab/evaluation/contracts.py",
    "src/healthcare_ai_lab/evaluation/classification.py",
    "src/healthcare_ai_lab/evaluation/controller_diagnostics.py",
    "src/healthcare_ai_lab/evaluation/patient_classification.py",
    "src/healthcare_ai_lab/evaluation/registry.py",
    "tests/test_artifact.py",
    "tests/test_raw_trajectories.py",
    "tests/test_sepsis_features.py",
    "tests/test_trajectories.py",
    "tests/test_database_integration.py",
    "tests/test_classification.py",
    "tests/test_controller_diagnostics.py",
    "tests/test_patient_classification.py",
    "tests/test_gaussian_registry_regression.py",
    "tests/test_evaluation_time_contracts.py",
    "tests/test_allocation_comparison.py",
    "tests/test_allocation_sources.py",
    "tests/test_ecr_publish.py",
    "tests/test_decision_summaries.py",
    "tests/test_decision_export.py",
]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
# Preserve the existing API module's staged imports; no import-layout refactor.
ignore = ["E402"]
